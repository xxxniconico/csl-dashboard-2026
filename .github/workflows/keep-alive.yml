name: Keep Alive (prevent workflow suspension)

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This workflow makes a daily timestamp commit to keep the repo "active".
on:
  schedule:
    - cron: '0 12 * * *'  # 20:00 北京时间 daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push
